[package]
name = "background_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dark-light = "2.0.0"
photon-rs = { version = "0.3.3", default-features = false }
regex = "1.12.2"
slint = "1.14.1"
tray-item = { version = "0.10.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.10.0", features = ["ksni"] }
xcb = { version = "1.6", features = ["randr"] }
smithay-client-toolkit = { version = "0.20", default-features = false }
more-wallpapers = "0.4.0"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1 # Optional: set a lower optimization level for your own code

[build-dependencies]
slint-build = "1.14.1"
